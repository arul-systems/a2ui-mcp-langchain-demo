name: Deploy agent (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/item_mcp/**"
      - ".mcp.json"
      - ".github/workflows/deploy-agent.yml"

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export requirements.txt for Oryx build
        run: uv export --format requirements.txt --no-dev --no-hashes -o agent/requirements.txt

      - name: Copy .mcp.json into the function app package
        run: cp .mcp.json agent/.mcp.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: "agent"
          remote-build: true
          respect-funcignore: true
