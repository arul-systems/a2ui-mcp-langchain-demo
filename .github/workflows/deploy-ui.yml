name: Deploy agent-ui (static website)

on:
  push:
    branches: [main]
    paths:
      - "agent-ui/**"
      - ".github/workflows/deploy-ui.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agent-ui/package-lock.json

      - name: Install dependencies
        working-directory: agent-ui
        run: npm ci

      - name: Build
        working-directory: agent-ui
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload build to static website ($web container)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ vars.AZURE_STORAGE_ACCOUNT_UI }} \
              --auth-mode login \
              -d '$web' \
              -s agent-ui/dist \
              --overwrite
