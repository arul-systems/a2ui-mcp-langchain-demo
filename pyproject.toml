[project]
name = "a2ui-mcp-langchain-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk>=0.8.0,<0.9.0",
    "fastapi>=0.115",
    "fastmcp==3.4.8",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "mcp-server-sqlite>=2025.4.25",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
a2ui-agent-sdk = { git = "https://github.com/a2ui-project/a2ui.git", subdirectory = "python/a2ui_agent" }
